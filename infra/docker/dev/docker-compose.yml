name: ${COMPOSE_PROJECT_NAME:-akkezxla-ligue-1-dev}

services:
  app:
    build:
      context: ../../..
      dockerfile: infra/docker/dev/Dockerfile
    image: ${APP_IMAGE:-akkezxla-ligue-1-app-dev:latest}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    volumes:
      - ../../../backend:/var/www
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-ligue1}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-60}
      DB_WAIT_SLEEP: ${DB_WAIT_SLEEP:-2}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ligue1

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../../../backend:/var/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ligue1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-ligue1}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-laravel}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-laravel}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USERNAME:-laravel}} -d ${POSTGRES_DB:-${DB_DATABASE:-ligue1}}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligue1

  adminer:
    image: adminer:4.8.1
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-postgres}
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - ligue1

networks:
  ligue1:
    name: ligue1
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
