name: ${COMPOSE_PROJECT_NAME:-akkezxla-ligue-1-prod}

services:
  app:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/Dockerfile
      target: app
    image: ${APP_IMAGE:-akkezxla-ligue-1-app-prod:latest}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-ligue1}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-laravel}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-60}
      DB_WAIT_SLEEP: ${DB_WAIT_SLEEP:-2}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ligue1

  nginx:
    build:
      context: ../../..
      dockerfile: infra/docker/prod/Dockerfile
      target: nginx
    image: ${NGINX_IMAGE:-akkezxla-ligue-1-nginx-prod:latest}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - ligue1

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_DATABASE:-ligue1}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-laravel}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-laravel}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USERNAME:-laravel}} -d ${POSTGRES_DB:-${DB_DATABASE:-ligue1}}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ligue1

networks:
  ligue1:
    name: ligue1
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data
